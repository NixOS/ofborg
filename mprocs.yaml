procs:
  rabbitmq:
    shell: mprocs/start-rabbitmq.sh
    env:
      RUST_LOG: info
    stop:
      send-keys: ["<C-c>"]
  rabbitmq-init:
    shell: mprocs/wait-for-rabbitmq.sh && mprocs/bootstrap-rabbitmq.sh
    env:
      RUST_LOG: info
  evaluation-filter:
    shell: mprocs/wait-for-rabbitmq.sh && mprocs/bootstrap-ofborg.sh && cargo r --bin evaluation-filter .ofborg-data/local.json
    env:
      RUST_LOG: info
  github-comment-filter:
    shell: mprocs/wait-for-rabbitmq.sh && mprocs/bootstrap-ofborg.sh && cargo r --bin github-comment-filter .ofborg-data/local.json
    env:
      RUST_LOG: info
  github-webhook-receiver:
    shell: mprocs/wait-for-rabbitmq.sh && mprocs/bootstrap-ofborg.sh && cargo r --bin github-webhook-receiver .ofborg-data/local.json
    env:
      RUST_LOG: info
  mass-rebuilder:
    shell: mprocs/wait-for-rabbitmq.sh && mprocs/bootstrap-ofborg.sh && cargo r --bin mass-rebuilder .ofborg-data/local.json
    env:
      RUST_LOG: info
  stats:
    shell: mprocs/wait-for-rabbitmq.sh && mprocs/bootstrap-ofborg.sh && cargo r --bin stats .ofborg-data/local.json
    env:
      RUST_LOG: info
  hydra-evaluator:
    shell: mprocs/wait-for-rabbitmq.sh && mprocs/bootstrap-ofborg.sh && cargo r -p hydra-evaluator --bin hydra-evaluator -- .ofborg-data/local.json
    env:
      RUST_LOG: info
  # Needs a `github_app` config section, which the local bootstrap does not
  # write; start it manually once you have one.
  github-comment-poster:
    autostart: false
    shell: mprocs/wait-for-rabbitmq.sh && mprocs/bootstrap-ofborg.sh && cargo r --bin github-comment-poster .ofborg-data/local.json
    env:
      RUST_LOG: info
  # Needs either a queue-runner with the SubscribeBuildEvents RPC, or
  # `--replay mprocs/example-build-events.jsonl` to drive it from a file.
  hydra-build-tracker:
    shell: mprocs/wait-for-rabbitmq.sh && mprocs/bootstrap-ofborg.sh && cargo r -p hydra-evaluator --bin hydra-build-tracker -- .ofborg-data/local.json --replay mprocs/example-build-events.jsonl
    env:
      RUST_LOG: info
