[package]
name = "hydra-evaluator"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"

[features]
default = []
# Subscribe to the queue-runner's build event stream. Needs a `hydra-proto`
# revision that has the `SubscribeBuildEvents` RPC — see "Reporting builds back
# to GitHub" in DEVELOPMENT.md for how to move the pin below. Without it, drive
# `hydra-build-tracker` with `--replay`.
queue-runner-events = []

[lib]
name = "hydra_evaluator"
path = "src/lib.rs"

[dependencies]
tracing = "0.1"

anyhow = "1.0.98"
clap = { version = "4", features = ["derive"] }
fs-err = { version = "3.0", features = ["tokio"] }

tokio = { version = "1.50", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
tonic = { version = "0.14", features = ["zstd", "tls-webpki-roots"] }
tower = "0.5"
hyper-util = { version = "0.1.10", features = ["full"] }

lapin = "4.3.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

url = "2.5.4"
toml = "1.0.0"

harmonia-store-path = { git = "https://github.com/nix-community/harmonia.git" }
nix-utils = { git = "https://github.com/helsinki-systems/hydra", rev = "9325c91f00a812f628a0f093bdaa077ecca02de6" }
hydra-tracing = { git = "https://github.com/helsinki-systems/hydra", rev = "9325c91f00a812f628a0f093bdaa077ecca02de6" }
hydra-proto = { git = "https://github.com/helsinki-systems/hydra", rev = "9325c91f00a812f628a0f093bdaa077ecca02de6", features = [ "client" ]  }
store-transfer = { git = "https://github.com/helsinki-systems/hydra", rev = "9325c91f00a812f628a0f093bdaa077ecca02de6" }
ofborg = { path = "../ofborg" }
hyper-rustls = "=0.27.3" # required for ofborg::octocrab
